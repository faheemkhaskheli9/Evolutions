name: Long validation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  long:
    name: Ecological validation (cold-adaptation cline, speciation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo test --release -p evo-engine --test validation -- --ignored --nocapture
