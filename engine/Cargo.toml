[workspace]
resolver = "2"
members = ["evo-engine", "evo-cli", "evo-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 3
